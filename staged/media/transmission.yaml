apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  labels:
    share: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
        share: media
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"vpn-egress","default-route":["10.7.123.1"]}]'
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      securityContext:
        fsGroup: 1000
      nodeSelector:
        egress: vpn
      tolerations:
        - key: egress
          operator: Equal
          value: vpn
          effect: NoSchedule
      containers:
        - name: transmission
          image: lscr.io/linuxserver/transmission:4.1.3-r0-ls361
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: home-config
                  key: TZ
          ports:
            - name: http
              containerPort: 9091
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: transmission
        - name: media
          nfs:
            server: placeholder
            path: placeholder
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
spec:
  selector:
    app: transmission
  ports:
    - name: http
      port: 9091
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transmission
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home
      namespace: nginx-gateway
  hostnames:
    - transmission.placeholder
  rules:
    - backendRefs:
        - name: transmission
          port: 9091
