apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  labels:
    share: media
    nas-apps: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
        share: media
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"vpn-egress","default-route":["10.7.123.1"]}]'
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      securityContext:
        fsGroup: 1000
      nodeSelector:
        egress: vpn
      tolerations:
        - key: egress
          operator: Equal
          value: vpn
          effect: NoSchedule
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls159
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: home-config
                  key: TZ
          ports:
            - name: http
              containerPort: 9696
          volumeMounts:
            - name: apps
              mountPath: /config
              subPath: media/prowlarr
            - name: media
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
      volumes:
        - name: apps
          nfs:
            server: placeholder
            path: placeholder
        - name: media
          nfs:
            server: placeholder
            path: placeholder
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
spec:
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home
      namespace: nginx-gateway
  hostnames:
    - prowlarr.placeholder
  rules:
    - backendRefs:
        - name: prowlarr
          port: 9696
