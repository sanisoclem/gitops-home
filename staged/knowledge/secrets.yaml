apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: karakeep
    creationPolicy: Owner
  data:
    - secretKey: meilisearch-master-key
      remoteRef:
        key: home-misc
        property: meilisearch-master-key
    - secretKey: nextauth-secret
      remoteRef:
        key: home-misc
        property: karakeep-nextauth-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: couchdb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: couchdb
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: obsidian
        password: "{{ .password }}"
        secret: "{{ .secret }}"
        erlang-cookie: "{{ .cookie }}"
  data:
    - secretKey: password
      remoteRef:
        key: home-misc
        property: couchdb-password
    - secretKey: secret
      remoteRef:
        key: home-misc
        property: couchdb-secret
    - secretKey: cookie
      remoteRef:
        key: home-misc
        property: couchdb-erlang-cookie
