apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: paperless-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: paperless
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: home-db
        property: paperless
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: paperless
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: home-misc
        property: paperless-secret-key
    - secretKey: admin-password
      remoteRef:
        key: home-misc
        property: paperless-admin-password
