apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  labels:
    share: knowledge
    nas-apps: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
        share: knowledge
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          env:
            - name: PAPERLESS_PORT
              value: "8000"
            - name: PAPERLESS_TIME_ZONE
              valueFrom:
                configMapKeyRef:
                  name: home-config
                  key: TZ
            - name: PAPERLESS_REDIS
              value: redis://valkey.home-services.svc.cluster.local:6379/1
            - name: PAPERLESS_DBHOST
              value: postgres-rw.home-services.svc.cluster.local
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: paperless-db
                  key: username
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-db
                  key: password
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: secret-key
            - name: PAPERLESS_ADMIN_USER
              value: admin
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: admin-password
            - name: PAPERLESS_URL
              value: https://paperless.placeholder
            - name: PAPERLESS_CONSUMPTION_DIR
              value: /knowledge/paperless-inbox
            - name: PAPERLESS_AI_ENABLED
              value: "true"
            - name: PAPERLESS_AI_LLM_EMBEDDING_BACKEND
              value: huggingface
            - name: PAPERLESS_AI_LLM_BACKEND
              value: ollama
            - name: PAPERLESS_AI_LLM_ENDPOINT
              value: http://10.11.7.11:11434
            - name: PAPERLESS_AI_LLM_MODEL
              value: gemma3:12b
            - name: PAPERLESS_AI_LLM_REQUEST_TIMEOUT
              value: "30"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: apps
              mountPath: /usr/src/paperless/media
              subPath: knowledge/paperless/media
            - name: knowledge
              mountPath: /knowledge
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 3Gi
        - name: r2-inbox
          image: rclone/rclone:1.75.1
          command: ["/bin/sh", "-c"]
          args:
            - while true; do rclone move -v r2:paperless-inbox /knowledge/paperless-inbox; sleep 60; done
          env:
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Cloudflare
          envFrom:
            - secretRef:
                name: paperless-r2
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: knowledge
              mountPath: /knowledge
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: apps
          nfs:
            server: placeholder
            path: placeholder
        - name: knowledge
          nfs:
            server: placeholder
            path: placeholder
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
spec:
  selector:
    app: paperless
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
spec:
  storageClassName: block-backed
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home
      namespace: nginx-gateway
  hostnames:
    - paperless.placeholder
  rules:
    - backendRefs:
        - name: paperless
          port: 8000
