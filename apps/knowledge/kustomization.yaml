apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../config
  - secrets.yaml
  - paperless.yaml
components:
  - ../../components/cluster-values

replacements:
  - source:
      kind: ConfigMap
      name: home-config
      fieldPath: data.HOME_ZONE
    targets:
      - select:
          kind: Deployment
          name: paperless
        fieldPaths:
          - spec.template.spec.containers.[name=paperless].env.[name=PAPERLESS_URL].value
        options:
          delimiter: '.'
          index: 1
