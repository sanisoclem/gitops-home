apiVersion: apps/v1
kind: Deployment
metadata:
  name: immichframe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immichframe
  template:
    metadata:
      labels:
        app: immichframe
    spec:
      containers:
        - name: immichframe
          image: ghcr.io/immichframe/immichframe:v1.0.37.0
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: home-config
                  key: TZ
            - name: ImmichServerUrl
              value: http://immich:2283
            - name: ApiKey
              valueFrom:
                secretKeyRef:
                  name: immichframe
                  key: api-key
            - name: ShowFavorites
              value: "true"
            - name: ShowMemories
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immichframe
spec:
  selector:
    app: immichframe
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immichframe
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home
      namespace: nginx-gateway
  hostnames:
    - frame.placeholder
  rules:
    - backendRefs:
        - name: immichframe
          port: 8080
