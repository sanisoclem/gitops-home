apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: vpn
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: vpn
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: plex
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: plex
